[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lraudit"
version = "0.1.0"
description = "Interventional audit of lesion reliance and saliency faithfulness in medical image classifiers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Aravinda C V"}]
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "opencv-python-headless", "torch"]

[tool.setuptools]
packages = ["lraudit"]
